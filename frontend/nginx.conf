server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: seluruh route ditangani React Router, bukan nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Berkas upload TIDAK disajikan dari sini. Aksesnya lewat
  # GET /api/dokumen/{id}/berkas di backend, yang memeriksa peran dan
  # kepemilikan lebih dulu (SDD BAB 7).
}
