# =============================================================================
#  docker-compose.yml — iMitra
# =============================================================================
#
#  TARGET YANG DINILAI (brief §7.2 butir 1):
#      git clone <repo> && cd <repo> && cp .env.example .env && docker compose up
#  dari CLONE BERSIH di mesin penilai, dan seluruh sistem hidup.
#
#  DUA MODE DATABASE — dipilih dari `.env`, bukan dari flag perintah.
#  Rinciannya di docs/DATABASE.md.
#
#    COMPOSE_PROFILES=lokal   -> container `db` di bawah ikut hidup.
#                               Ini BAWAAN di .env.example, dan inilah yang
#                               dipakai penilai dari clone bersih.
#
#    COMPOSE_PROFILES=        -> container `db` dilewati; backend menyambung ke
#                               DATABASE_URL apa pun yang ada di .env — untuk
#                               kami, PostgreSQL terkelola Aiven.
#
#  Perintahnya tetap satu dan sama untuk keduanya: `docker compose up`.
#  Yang membedakan hanya isi .env, dan .env tidak pernah di-commit.
#
#  Kenapa mode lokal harus tetap menjadi bawaan: penilai menyalin .env.example
#  apa adanya, dan berkas itu tidak memuat password Aiven (tidak boleh memuatnya,
#  -10 untuk secret ter-commit). Kalau Aiven satu-satunya jalan, penilai tidak
#  bisa menjalankan repo ini sama sekali — kriteria DISKUALIFIKASI (§7.3).
#
#  Urutan startup dijamin healthcheck dan gelung tunggu di service migrate,
#  bukan `sleep` yang ditebak panjangnya.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  db — PostgreSQL lokal. Hanya hidup bila COMPOSE_PROFILES memuat `lokal`.
  #  Tidak ada service lain yang `depends_on` service ini, justru supaya ia bisa
  #  dilewati tanpa merusak grafik ketergantungan.
  # ---------------------------------------------------------------------------
  db:
    profiles: ["lokal"]
    image: postgres:16-alpine
    container_name: imitra-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Diekspos hanya untuk inspeksi manual (psql / DBeaver) saat debugging.
      - "${DB_PORT}:5432"
    volumes:
      - imitra-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks: [imitra]

  # ---------------------------------------------------------------------------
  #  mock-slik — stub layanan SLIK (brief §6.1)
  #  Layanan TERPISAH yang dipanggil backend via HTTP, bukan fungsi lokal.
  # ---------------------------------------------------------------------------
  mock-slik:
    build:
      context: ./mock-slik
    container_name: imitra-mock-slik
    restart: unless-stopped
    environment:
      PORT: 9090
      APP_ENV: ${APP_ENV}
      LOG_LEVEL: ${LOG_LEVEL}
      # Path DI DALAM container, bukan path di host.
      FIXTURES_PATH: /app/fixtures/nasabah-uji.csv
    ports:
      - "${MOCK_SLIK_PORT}:9090"
    volumes:
      # read-only: mock membaca fixtures, tidak menyalinnya ke dalam kode
      # dan tidak boleh menulisinya.
      - ./fixtures:/app/fixtures:ro
    healthcheck:
      # wget sudah ada di image node:20-alpine. Memakai perintah yang tidak ada
      # di image adalah penyebab umum container yang selalu unhealthy padahal
      # layanannya hidup.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [imitra]

  # ---------------------------------------------------------------------------
  #  migrate — sekali jalan: migrasi lalu seed, kemudian berhenti.
  #  Penilai TIDAK perlu menjalankan perintah tambahan. Seed idempoten, jadi
  #  `docker compose up` kedua kali tidak error.
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: ./backend
      # Sengaja memakai stage `build`, bukan `runtime`: stage itu masih memuat
      # Prisma CLI dan tsx (keduanya devDependency), yang diperlukan untuk
      # menjalankan migrasi dan seed. Image runtime sengaja tidak memuatnya.
      target: build
    container_name: imitra-migrate
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      PASSWORD_HASH_COST: ${PASSWORD_HASH_COST}
      FIXTURES_PATH: /app/fixtures/nasabah-uji.csv
      TZ: ${TZ}
    volumes:
      - ./fixtures:/app/fixtures:ro
    # Gelung tunggu, bukan `depends_on: db`. Alasannya: service `db` bisa saja
    # sengaja tidak dijalankan (mode Aiven), dan depends_on ke service yang
    # dilewati profil akan menggagalkan `docker compose up`.
    #
    # 30 percobaan x 2 detik = maksimum 60 detik. Cukup untuk postgres lokal
    # yang baru start, dan cukup untuk jaringan yang sedang lambat ke Aiven.
    # Kalau tetap gagal, container ini keluar dengan kode bukan-nol, dan backend
    # TIDAK ikut hidup — lebih baik berhenti daripada hidup tanpa skema.
    # Bentuk daftar, bukan string, supaya tidak ada kutip bersarang yang harus
    # ditebak siapa yang mem-parsing-nya. `$$` menjadi `$` di dalam container.
    command:
      - sh
      - -c
      - >-
        for i in $$(seq 1 30); do npx prisma migrate deploy && break;
        echo "migrate: database belum siap, percobaan $$i dari 30"; sleep 2; done;
        npx prisma migrate deploy && npx tsx prisma/seed.ts
    restart: "no"
    networks: [imitra]

  # ---------------------------------------------------------------------------
  #  backend — API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: imitra-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV}
      TZ: ${TZ}
      LOG_LEVEL: ${LOG_LEVEL}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      PASSWORD_HASH_COST: ${PASSWORD_HASH_COST}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD}
      # Nama service docker: BENAR di sini, karena pemanggilnya container backend.
      SLIK_BASE_URL: ${SLIK_BASE_URL}
      SLIK_INQUIRY_PATH: ${SLIK_INQUIRY_PATH}
      SLIK_TIMEOUT_MS: ${SLIK_TIMEOUT_MS}
      SLIK_RETRY: ${SLIK_RETRY}
      UPLOAD_DIR: /app/uploads
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES}
      UPLOAD_ALLOWED_MIME: ${UPLOAD_ALLOWED_MIME}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - imitra-uploads:/app/uploads
    depends_on:
      # Sengaja TANPA `db`: service itu bisa dilewati profil (mode Aiven).
      # Kesiapan database sudah dijamin service `migrate` yang harus selesai
      # sukses lebih dulu.
      mock-slik:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    networks: [imitra]

  # ---------------------------------------------------------------------------
  #  frontend — UI (hasil build Vite disajikan nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      args:
        # Vite MENANAMKAN nilai ini saat build, jadi ia build arg bukan env
        # runtime. Nilainya localhost karena yang memanggil adalah BROWSER di
        # host — bukan container. Memakai http://backend:8080 di sini adalah
        # kesalahan yang paling sering membuat repo gagal di mesin penilai.
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT}
    container_name: imitra-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [imitra]

# =============================================================================
volumes:
  imitra-db-data:
  imitra-uploads:

networks:
  imitra:
    driver: bridge

# =============================================================================
#  Checklist sebelum menyatakan berkas ini selesai
#  (ulangi sebelum Gate 2 dan sekali lagi sebelum code freeze)
#
#   [ ] `docker compose config` tidak mengeluarkan error
#   [ ] `docker compose up` berhasil dari direktori hasil clone BARU
#   [ ] Semua service berstatus healthy (`docker compose ps`)
#   [ ] Migrasi dan seed jalan otomatis; database penilai tidak kosong
#   [ ] `docker compose up` kedua kali tidak error karena seed dijalankan ulang
#   [ ] Frontend bisa login sebagai AO tanpa mengubah konfigurasi apa pun
#   [ ] Backend berhasil memanggil mock-slik (uji dengan NIK dari fixtures)
#   [ ] Cara mereset demo terdokumentasi di README.md bagian 2.4
#   [ ] Semua variabel yang dipakai berkas ini ada di .env.example
#   [ ] Tidak ada nilai secret yang ditulis langsung di berkas ini
# =============================================================================
