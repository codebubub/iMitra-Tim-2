# =============================================================================
#  CI iMitra — stack Node 20 + TypeScript (ADR-0001)
# =============================================================================
#
#  Menggantikan workflow deteksi-stack bawaan template. Deteksi otomatis lebih
#  lambat dan lebih rapuh daripada workflow yang eksplisit.
#
#  Perintah lint dan test di bawah WAJIB identik dengan AGENTS.md bagian 7 dan
#  README.md bagian 2.6. Kalau ketiganya berbeda, salah satunya sudah usang.
#
#  CI MERAH DI TAG v1.0.0 DIKENAI PENGURANGAN -5. CI yang hijau tanpa menjalankan
#  test apa pun dinilai sama dengan tidak ada CI — karena itu job `test-unit`
#  memakai `--passWithNoTests=false` (bawaan Vitest) dan akan MERAH kalau
#  seseorang menghapus test.
# =============================================================================

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. Higiene repo. Murah, dan kegagalannya menyelamatkan nilai (-10 untuk
  #    secret ter-commit).
  # ---------------------------------------------------------------------------
  higiene:
    name: Higiene repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pastikan tidak ada berkas .env ter-commit
        shell: bash
        run: |
          set -euo pipefail
          BAD=$(git ls-files | grep -E '(^|/)\.env($|\.[^e]|\.local$|\.production$)' || true)
          if [ -n "$BAD" ]; then
            echo "::error title=Berkas .env ter-commit::$BAD"
            echo "Brief 7.2 butir 7: tidak ada secret di dalam repo. Secret ter-commit dikenai -10,"
            echo "termasuk kalau sudah dihapus di commit berikutnya. Hapus dari riwayat, bukan hanya dari HEAD."
            exit 1
          fi
          echo "OK: tidak ada berkas .env ter-commit."

      - name: Pastikan .env.example ada
        shell: bash
        run: |
          set -euo pipefail
          test -f .env.example || { echo "::error::.env.example wajib ada (brief 8.1)"; exit 1; }
          echo "OK: .env.example ada."

      - name: Cari kredensial yang terlihat seperti sungguhan
        shell: bash
        run: |
          set -euo pipefail
          # Pola yang paling sering lolos tanpa sengaja: URL database berisi
          # password, dan token penyedia awan. Dijalankan pada berkas ter-track
          # saja, dan .env.example dikecualikan karena isinya placeholder.
          POLA='(postgres(ql)?://[^:@/]+:[^@ "]{8,}@|AVNS_[A-Za-z0-9_-]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          HIT=$(git grep -InE "$POLA" -- . ':(exclude).env.example' ':(exclude)*.md' || true)
          if [ -n "$HIT" ]; then
            echo "::error title=Kredensial terdeteksi::$HIT"
            echo "Anggap kredensial itu sudah bocor: putar nilainya, jangan sekadar menghapus barisnya."
            exit 1
          fi
          echo "OK: tidak ada kredensial yang terdeteksi."

      - name: Pastikan artefak wajib repo ada
        shell: bash
        run: |
          set -euo pipefail
          MISSING=""
          for f in README.md AGENTS.md docs/AI-DEVLOG.md docs/AI-WORKFLOW.md \
                   docs/TRACEABILITY.md docs/DEMO-SCRIPT.md docs/SRS-iMitra.md \
                   docs/SDD-iMitra.md docs/adr/0001-pilihan-stack.md \
                   fixtures/nasabah-uji.csv docker-compose.yml; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::warning title=Artefak wajib belum ada::$MISSING"
          else
            echo "OK: seluruh artefak wajib ada."
          fi

      - name: Ingatkan placeholder yang belum diisi
        shell: bash
        run: |
          set -euo pipefail
          TOTAL=$(grep -rIo '<!-- ISI:' --include='*.md' . 2>/dev/null | wc -l | tr -d ' ')
          echo "Sisa placeholder: $TOTAL"
          if [ "${TOTAL:-0}" -gt 0 ]; then
            echo "::warning title=Placeholder template belum diisi::$TOTAL tersisa. Harus nol sebelum tag v1.0.0."
          fi

      - name: Pastikan docker compose valid
        shell: bash
        run: |
          set -euo pipefail
          cp .env.example .env
          docker compose config > /dev/null
          rm -f .env
          echo "OK: docker compose config valid."

  # ---------------------------------------------------------------------------
  # 2. Lint seluruh layanan.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layanan: [backend, frontend, mock-slik]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.layanan }}/package-lock.json
      - name: Install
        working-directory: ${{ matrix.layanan }}
        run: npm ci
      - name: Generate Prisma client
        if: matrix.layanan == 'backend'
        working-directory: backend
        run: npx prisma generate
      - name: Lint
        working-directory: ${{ matrix.layanan }}
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 3. Test unit — domain/ saja, tanpa database. Inilah yang menguji BR-01,
  #    BR-02, BR-05, BR-06, BR-07, BR-09, dan BR-12.
  # ---------------------------------------------------------------------------
  test-unit:
    name: Test unit (aturan bisnis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - working-directory: backend
        run: npx prisma generate
      - working-directory: backend
        run: npm run test:unit

  # ---------------------------------------------------------------------------
  # 4. Test kontrak mock SLIK — memastikan 200/404/503 sesuai brief 6.1.
  # ---------------------------------------------------------------------------
  test-mock-slik:
    name: Test kontrak mock SLIK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mock-slik/package-lock.json
      - working-directory: mock-slik
        run: npm ci
      - working-directory: mock-slik
        run: npm test

  # ---------------------------------------------------------------------------
  # 5. Test integrasi — dengan database sungguhan, migrasi, dan seed.
  #    Seed dijalankan DUA KALI untuk membuktikan idempoten (NFR-09).
  # ---------------------------------------------------------------------------
  test-integration:
    name: Test integrasi (API + database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: imitra_test
          POSTGRES_USER: imitra_app
          POSTGRES_PASSWORD: ci-bukan-password-sebenarnya
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U imitra_app -d imitra_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://imitra_app:ci-bukan-password-sebenarnya@localhost:5432/imitra_test?schema=public
      JWT_SECRET: ci-secret-bukan-nilai-produksi
      APP_ENV: test
      TZ: Asia/Jakarta
      SEED_DEFAULT_PASSWORD: Demo1234!
      PASSWORD_HASH_COST: '4'
      FIXTURES_PATH: ../fixtures/nasabah-uji.csv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: npm ci
      - name: Migrasi
        working-directory: backend
        run: npx prisma migrate deploy
      - name: Seed (pertama)
        working-directory: backend
        run: npm run seed
      - name: Seed (kedua) — membuktikan idempoten, NFR-09
        working-directory: backend
        run: npm run seed
      - name: Test integrasi
        working-directory: backend
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # 6. Gerbang akhir. INI nama yang didaftarkan sebagai required status check
  #    di Settings > Branches > branch protection rule untuk `main`.
  # ---------------------------------------------------------------------------
  ci:
    name: CI
    needs: [higiene, lint, test-unit, test-mock-slik, test-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Kumpulkan hasil
        shell: bash
        run: |
          set -euo pipefail
          echo "higiene          : ${{ needs.higiene.result }}"
          echo "lint             : ${{ needs.lint.result }}"
          echo "test-unit        : ${{ needs.test-unit.result }}"
          echo "test-mock-slik   : ${{ needs.test-mock-slik.result }}"
          echo "test-integration : ${{ needs.test-integration.result }}"

          for r in "${{ needs.higiene.result }}" "${{ needs.lint.result }}" \
                   "${{ needs.test-unit.result }}" "${{ needs.test-mock-slik.result }}" \
                   "${{ needs.test-integration.result }}"; do
            case "$r" in
              success) ;;
              *) echo "::error title=CI gagal::Ada job yang tidak lolos (status: $r)."; exit 1 ;;
            esac
          done
          echo "CI lolos."
